<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="Css/Style.css" />
  </head>
  <body>

    <!-- ========== HEADER: GREETING ========== -->
    <header class="header">
      <div class="greeting-block">
        <p id="greeting-text" class="greeting-text">Good morning!</p>
        <h1 id="greeting-name" class="greeting-name">Welcome back</h1>
      </div>
      <div class="datetime-block">
        <p id="clock" class="clock">00:00:00</p>
        <p id="date" class="date">Monday, 1 January 2026</p>
      </div>
    </header>

    <!-- ========== MAIN GRID ========== -->
    <main class="dashboard-grid">

      <!-- ===== FOCUS TIMER ===== -->
      <section class="card card--timer" aria-label="Focus Timer">
        <h2 class="card__title">
          <span class="card__icon">⏱</span> Focus Timer
        </h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-label" id="timer-label">Ready to focus</div>
        <div class="timer-controls">
          <button class="btn btn--primary" id="timer-start">Start</button>
          <button class="btn btn--secondary" id="timer-stop">Stop</button>
          <button class="btn btn--ghost" id="timer-reset">Reset</button>
        </div>
      </section>

      <!-- ===== TO-DO LIST ===== -->
      <section class="card card--todo" aria-label="To-Do List">
        <h2 class="card__title">
          <span class="card__icon">✅</span> To-Do List
        </h2>

        <!-- Add task form -->
        <form class="todo-form" id="todo-form" autocomplete="off">
          <input
            type="text"
            id="todo-input"
            class="todo-input"
            placeholder="Add a new task…"
            maxlength="120"
            aria-label="New task"
          />
          <button type="submit" class="btn btn--primary">Add</button>
        </form>

        <!-- Filter bar -->
        <div class="todo-filters" role="group" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="done">Done</button>
        </div>

        <!-- Task list -->
        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

        <!-- Footer -->
        <div class="todo-footer">
          <span id="todo-count" class="todo-count">0 tasks left</span>
          <button class="btn btn--ghost btn--sm" id="clear-done">Clear done</button>
        </div>
      </section>

      <!-- ===== QUICK LINKS ===== -->
      <section class="card card--links" aria-label="Quick Links">
        <h2 class="card__title">
          <span class="card__icon">🔗</span> Quick Links
        </h2>

        <!-- Add link form -->
        <form class="link-form" id="link-form" autocomplete="off">
          <input
            type="text"
            id="link-name"
            class="link-input"
            placeholder="Label (e.g. YouTube)"
            maxlength="30"
            aria-label="Link label"
          />
          <input
            type="url"
            id="link-url"
            class="link-input"
            placeholder="https://example.com"
            aria-label="Link URL"
          />
          <button type="submit" class="btn btn--primary">Save</button>
        </form>

        <!-- Links grid -->
        <div class="links-grid" id="links-grid" aria-live="polite"></div>
      </section>

    </main>

    <!-- ========== EDIT TASK MODAL ========== -->
    <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div class="modal">
        <h3 id="modal-title" class="modal__title">Edit Task</h3>
        <input
          type="text"
          id="modal-input"
          class="todo-input"
          maxlength="120"
          aria-label="Edit task text"
        />
        <div class="modal__actions">
          <button class="btn btn--primary" id="modal-save">Save</button>
          <button class="btn btn--ghost" id="modal-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/Script.js"></script>
  </body>
</html>
